<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">AI Engineering Team</title>
  <desc id="d">A multiplayer chat where five AI agents and you build software together on Cloudflare.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#glow)"/>

  <text x="64" y="128" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="#ffffff">AI Engineering Team</text>
  <text x="66" y="176" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#e0e7ff">A multiplayer chat where five AI agents and you build software together.</text>

  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff">
    <rect x="64" y="216" width="196" height="40" rx="20" fill="#ffffff" fill-opacity="0.16"/>
    <text x="162" y="242" text-anchor="middle">☁ Cloudflare Workers</text>
    <rect x="276" y="216" width="168" height="40" rx="20" fill="#ffffff" fill-opacity="0.16"/>
    <text x="360" y="242" text-anchor="middle">🦙 Llama 3.3</text>
    <rect x="460" y="216" width="200" height="40" rx="20" fill="#ffffff" fill-opacity="0.16"/>
    <text x="560" y="242" text-anchor="middle">🗄 Durable Objects</text>
    <rect x="676" y="216" width="170" height="40" rx="20" fill="#ffffff" fill-opacity="0.16"/>
    <text x="761" y="242" text-anchor="middle">🔎 Vectorize RAG</text>
  </g>

  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" color="#ffffff">
    <circle cx="1000" cy="110" r="46" fill="#7c3aed" stroke="#ffffff" stroke-width="4"/>
    <text x="1000" y="120" text-anchor="middle" fill="#ffffff">L</text>
    <circle cx="1080" cy="150" r="46" fill="#0284c7" stroke="#ffffff" stroke-width="4"/>
    <text x="1080" y="160" text-anchor="middle" fill="#ffffff">B</text>
    <circle cx="1000" cy="200" r="46" fill="#db2777" stroke="#ffffff" stroke-width="4"/>
    <text x="1000" y="210" text-anchor="middle" fill="#ffffff">F</text>
    <circle cx="1100" cy="250" r="46" fill="#d97706" stroke="#ffffff" stroke-width="4"/>
    <text x="1100" y="260" text-anchor="middle" fill="#ffffff">Q</text>
    <circle cx="920" cy="250" r="46" fill="#059669" stroke="#ffffff" stroke-width="4"/>
    <text x="920" y="260" text-anchor="middle" fill="#ffffff">D</text>
  </g>
</svg>
