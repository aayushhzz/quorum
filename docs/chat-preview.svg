<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
  <title id="t">Team chat preview</title>
  <desc id="d">Example conversation: the Lead plans a signup feature and hands tasks to Frontend, Backend and DevOps.</desc>
  <defs>
    <style>
      .frame { fill: #0f172a; }
      .panel { fill: #111827; }
      .bubble { fill: #1f2937; }
      .me { fill: #e5e7eb; }
      .txt { font: 400 15px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #e5e7eb; }
      .name { font: 600 13px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #9ca3af; }
      .tag { font: 600 15px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #a5b4fc; }
      .me-txt { font: 500 15px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #111827; }
      .side { font: 600 15px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #f9fafb; }
      .small { font: 400 12px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #9ca3af; }
      .av { font: 700 14px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>
  <rect class="frame" width="900" height="520" rx="18"/>
  <!-- sidebar -->
  <rect class="panel" x="0" y="0" width="250" height="520" rx="18"/>
  <text class="side" x="24" y="40">AI Engineering Team</text>
  <text class="small" x="24" y="62">● Connected · max 50 memories each</text>
  <circle cx="44" cy="106" r="16" fill="#7c3aed"/><text class="av" x="44" y="111" text-anchor="middle">L</text>
  <text class="txt" x="72" y="102">Lena <tspan class="small">@lead</tspan></text>
  <text class="small" x="72" y="120">Tech Lead · 6 memories</text>
  <circle cx="44" cy="164" r="16" fill="#0284c7"/><text class="av" x="44" y="169" text-anchor="middle">B</text>
  <text class="txt" x="72" y="160">Bao <tspan class="small">@backend</tspan></text>
  <text class="small" x="72" y="178">typing…</text>
  <circle cx="44" cy="222" r="16" fill="#db2777"/><text class="av" x="44" y="227" text-anchor="middle">F</text>
  <text class="txt" x="72" y="218">Fern <tspan class="small">@frontend</tspan></text>
  <text class="small" x="72" y="236">Frontend Engineer · 5 memories</text>
  <circle cx="44" cy="280" r="16" fill="#d97706"/><text class="av" x="44" y="285" text-anchor="middle">Q</text>
  <text class="txt" x="72" y="276">Quinn <tspan class="small">@qa</tspan></text>
  <text class="small" x="72" y="294">QA Engineer · 3 memories</text>
  <circle cx="44" cy="338" r="16" fill="#059669"/><text class="av" x="44" y="343" text-anchor="middle">D</text>
  <text class="txt" x="72" y="334">Dev <tspan class="small">@devops</tspan></text>
  <text class="small" x="72" y="352">DevOps Engineer · 4 memories</text>

  <!-- messages -->
  <text class="name" x="290" y="46">You</text>
  <rect class="me" x="290" y="54" width="430" height="36" rx="18"/>
  <text class="me-txt" x="308" y="77">We need a signup page with email verification. Plan it.</text>

  <circle cx="306" cy="128" r="16" fill="#7c3aed"/><text class="av" x="306" y="133" text-anchor="middle">L</text>
  <text class="name" x="334" y="118">Lena · Tech Lead</text>
  <rect class="bubble" x="334" y="126" width="530" height="58" rx="14"/>
  <text class="txt" x="350" y="150">Break it into tasks. <tspan class="tag">@fern</tspan> wireframe the page,</text>
  <text class="txt" x="350" y="170"><tspan class="tag">@bao</tspan> define the verification endpoint.</text>

  <circle cx="306" cy="232" r="16" fill="#db2777"/><text class="av" x="306" y="237" text-anchor="middle">F</text>
  <text class="name" x="334" y="222">Fern · Frontend Engineer</text>
  <rect class="bubble" x="334" y="230" width="530" height="58" rx="14"/>
  <text class="txt" x="350" y="254">Form: email, password, verification code.</text>
  <text class="txt" x="350" y="274">Asking <tspan class="tag">@bao</tspan> to confirm the payload shape.</text>

  <circle cx="306" cy="336" r="16" fill="#0284c7"/><text class="av" x="306" y="341" text-anchor="middle">B</text>
  <text class="name" x="334" y="326">Bao · Backend Engineer</text>
  <rect class="bubble" x="334" y="334" width="530" height="58" rx="14"/>
  <text class="txt" x="350" y="358">POST /api/send-verification-email with validation.</text>
  <text class="txt" x="350" y="378">Handing delivery to <tspan class="tag">@devops</tspan>.</text>

  <circle cx="306" cy="440" r="16" fill="#059669"/><text class="av" x="306" y="445" text-anchor="middle">D</text>
  <text class="name" x="334" y="430">Dev · DevOps Engineer</text>
  <rect class="bubble" x="334" y="438" width="530" height="44" rx="14"/>
  <text class="txt" x="350" y="465">Email provider set up. Keys stored as secrets, not in code.</text>

  <text class="small" x="290" y="506">Example conversation from a test run. Each agent only remembers what it chose to keep.</text>
</svg>
